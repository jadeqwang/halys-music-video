<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HALYS lookdev lab</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #111; color: #ccc; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; max-width: 1280px; }
  #view { width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button, input { font: inherit; }
</style>
</head>
<body>
<main>
  <img id="view" alt="">
  <div class="bar">
    <select id="plate"><option>a_duel</option><option>b_face</option><option>c_armies</option><option>d_room</option></select>
    <select id="mat"><option>bronze</option><option>corona</option><option>marble</option><option>ink</option></select>
    <label>t <input id="t" type="number" value="0" step="0.0417" style="width:6em"></label>
    <button id="go">render</button><span id="info"></span>
  </div>
</main>
<script type="module">
  import './src/main.js';
  // interactive use: open /video/lab/lab.html through any static server rooted at the repo
  if (!new URLSearchParams(location.search).has('headless')) {
    const $ = id => document.getElementById(id);
    const go = async () => {
      $('info').textContent = 'rendering…';
      const r = await window.renderStill({ plate: $('plate').value, material: $('mat').value, t: +$('t').value, quality: .9 });
      $('view').src = r.url; $('info').textContent = JSON.stringify(r.ms);
    };
    $('go').onclick = go;
  }
</script>
</body>
</html>
