<!doctype html><html><body><script type="module">
import { LineGL, lin } from './gpu.js';
const out = [];
const gl = new LineGL(1920, 1080);
const colors = { pearl: lin('#f3efe6'), orange: lin('#f08a2a'), red: lin('#d6452c'), bg: lin('#05070c'), ink: lin('#030407') };
const time = (label, fn, n = 5) => { fn(); gl.sync(); const t0 = performance.now(); for (let k = 0; k < n; k++) { fn(); gl.sync(); } out.push(label + ' ' + ((performance.now() - t0) / n).toFixed(1) + ' ms'); };
time('render empty, glow on', () => gl.render([], { colors }));
time('render empty, glow off', () => gl.render([], { colors, glow: [0, 0] }));
const c2 = new OffscreenCanvas(1920, 1080), g2 = c2.getContext('2d');
time('render + drawImage', () => { gl.render([], { colors }); g2.drawImage(gl.canvas, 0, 0); g2.getImageData(0, 0, 1, 1); });
const c3 = document.createElement('canvas'); c3.width = 1920; c3.height = 1080; const g3 = c3.getContext('2d');
time('render + drawImage(html canvas 2d)', () => { gl.render([], { colors }); g3.drawImage(gl.canvas, 0, 0); g3.getImageData(0, 0, 1, 1); });
time('jpeg encode html canvas', () => { c3.toDataURL('image/jpeg', .93); }, 3);
window.RESULT = out;
</script></body></html>
